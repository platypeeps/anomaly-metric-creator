# SD AI Command Pack Gito project configuration.
#
# Gito reads this repo-local file from .gito/config.toml and merges it with
# Gito's bundled defaults. Keep provider selection and credentials in
# ~/.gito/.env or process environment variables, not in this committed file.

retries = 3

exclude_files = [
  ".github/**",
  ".claude/**",
  ".codex/**",
  ".gemini/**",
  ".opencode/**",
  ".agents/**",
  ".build/**",
  ".git/**",
  ".pytest_cache/**",
  ".obsidian-kb/**",
  # .trellis mixes copied Trellis tooling with repo-owned delivery documents.
  # Exclude only the copied surfaces -- the same boundary the review preflight's
  # isTrellisCopiedPath uses -- plus bulk bookkeeping, so a task-only or
  # spec-only change still leaves a non-empty local review scope instead of
  # failing the provider with an empty diff.
  #
  # .trellis/workspace/** is deliberately NOT excluded. The journal and its
  # index are the only paths every finalization touches: a completion bundle is
  # an archive move plus a journal session, and a planning bundle is journal-only.
  # Excluding them left a finalization PR with nothing in scope, which the
  # coordinator reports as `local provider failure blocks remote routing` rather
  # than as an empty diff. Keeping them reviewable makes that class of PR
  # non-empty by construction, and the diff is one appended session rather than
  # the whole file.
  ".trellis/.template-hashes.json",
  ".trellis/.version",
  ".trellis/scripts/**",
  ".trellis/agents/**",
  ".trellis/tasks/archive/**",
  ".ruff_cache/**",
  ".venv/**",
  ".sd-ai-command-pack/**",
  "node_modules/**",
]

[prompt_vars]
requirements = """
- Treat copied Trellis and sd-ai-command-pack files as tooling/generated surfaces unless the change intentionally updates their source or install contract.
- Prefer findings about behavior, security, data integrity, and maintainability over wording or style feedback in copied command-pack files.
"""
