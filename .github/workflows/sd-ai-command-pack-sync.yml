name: SD AI command-pack sync

on:
  schedule:
    # Monday 09:17 UTC. The non-round minute avoids the busiest scheduler edge.
    - cron: '17 9 * * 1'
  workflow_dispatch:

concurrency:
  group: sd-ai-command-pack-sync
  cancel-in-progress: false

# The job writes only through a dedicated pull-request branch. A scoped token
# secret is used so the repo-wide Actions create/approve setting can stay off;
# branch protection and the required CI Result remain authoritative.
permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Fetch current command pack
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main \
            https://github.com/platypeeps/sd-ai-command-pack.git \
            "$RUNNER_TEMP/sd-ai-command-pack"

      - name: Refresh installed command-pack assets
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/sd-ai-command-pack/install.py" "$GITHUB_WORKSPACE" --force

      - name: Refresh generated repository map
        shell: bash
        run: npm exec --yes --package=repomix@1.16.1 -- bash scripts/update_repomix

      - name: Verify scoped PR token
        shell: bash
        env:
          SCOPED_TOKEN: ${{ secrets.SD_AI_COMMAND_PACK_PR_TOKEN }}
        run: |
          if [ -z "$SCOPED_TOKEN" ]; then
            echo "::error::SD_AI_COMMAND_PACK_PR_TOKEN is not configured"
            exit 1
          fi

      # create-pull-request exits without creating a branch or PR when the
      # refreshed tree matches main. Its fixed branch updates one standing PR
      # instead of creating duplicates if another weekly run occurs first.
      - name: Create or update refresh pull request
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.SD_AI_COMMAND_PACK_PR_TOKEN }}
          base: main
          branch: automation/sd-ai-command-pack-sync
          delete-branch: true
          commit-message: "chore: refresh sd-ai-command-pack"
          title: "chore: refresh sd-ai-command-pack"
          body: |
            ## Summary

            - Refresh the installed SD AI command-pack assets from the source repository's `main` branch.
            - Refresh the generated metadata-only repository map.

            Tooling/generated scope: generated command-pack assets and `docs/repomix-map.md`; review repository-owned integration changes and provenance.

            ## Validation

            - [ ] Required `CI Result` passes.
            - [ ] Advisory Windows collection result reviewed.

            This PR was opened only because the canonical installer produced a real diff. Auto-merge remains gated by normal branch protection.

      - name: Arm normal gated auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.SD_AI_COMMAND_PACK_PR_TOKEN }}
          PR_URL: ${{ steps.create-pr.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PR_URL"
