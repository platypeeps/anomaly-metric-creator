# Installed by `sd-review setup-github`. Opt-in: nothing installs this file, and
# deleting it removes the lane.
#
# What it does: resolves this pull request's diff, runs `route()` over this
# repository's review policy -- `.github/sd-review.json` when that file exists,
# the built-in default when it does not -- and prints the resulting plan.
#
# What it does not do: it requests no reviewer, posts no comment, sets no label,
# and holds `contents: read` and nothing else, so it cannot affect this pull
# request's outcome. Asking a remote reviewer for a review is a separate change
# with its own decision record.
name: sd-review route

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A superseded plan is a stale plan: when a pull request is pushed to twice in
# quick succession, the older run is describing a diff that no longer exists.
concurrency:
  group: sd-review-route-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  route:
    name: route
    runs-on: ubuntu-latest
    # The work is a diff and a pure function over it, measured in seconds. This
    # ceiling is not a budget, it is the point at which a hung runner stops
    # costing a repository capacity for a job that reports and nothing more.
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request's head ref, not the default `refs/pull/N/merge`
          # and not the bare head SHA.
          #
          # Not `/merge`: GitHub does not create that ref for a pull request
          # with conflicts. Measured on one (#966, sd:878), GitHub starts no
          # `pull_request` run at all in that state, so this job never reaches
          # checkout there. What the merge ref would lose is the window between
          # the two -- mergeable when the event fires, conflicted by the time
          # the runner checks out -- and that window has not been produced. An
          # advisory lane must never be the thing that makes one look worse.
          #
          # Not the bare SHA: with `fetch-depth: 0`, `actions/checkout` fetches
          # `+refs/heads/*` and tags, and adds a pull refspec only when the ref
          # *is* one. A fork's head commit is on no branch of this repository,
          # so a SHA checkout resolves for same-repo pull requests and fails
          # for forks.
          #
          # And not `repository: <fork>`, which would make `origin` the fork --
          # `origin/${{ github.base_ref }}` would then name the fork's base
          # branch, and `route()` would measure the diff against the wrong
          # thing while looking like it worked.
          #
          # `refs/pull/N/head` is the head commit either way, exists whether or
          # not the pull request merges cleanly, and leaves `origin` pointing
          # at this repository.
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          # `route()` measures the branch against its merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0
          persist-credentials: false
      - name: Report the routing plan
        uses: platypeeps/sd-ai-command-pack/actions/review-route@47d4d147fa1b7cb819b6fe1fd2569c87f6280698
