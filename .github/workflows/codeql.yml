name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # `full-ci` lifetime is intentionally asymmetric across the workflows
    # (pinned in tools/check_ci_review_contract.py so it cannot drift):
    # ci.yml and socket.yml honor the label ONE-SHOT (only at the `labeled`
    # event; a later plain `synchronize` drops back to the quick lane / skip)
    # because the full matrix and Socket scan are the cost-gated lanes. CodeQL
    # is advisory and cheap, so it honors the label PERSISTENTLY — the
    # `synchronize` arm below re-reads the label set on every push while the
    # label is present (contains(...labels...), not just github.event.label on
    # the labeled event), keeping security analysis running for the life of a
    # flagged PR. Do not "unify" by making CodeQL one-shot: that reduces
    # security coverage, the wrong direction for a scanner.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
            github.event.pull_request.draft == false &&
            (
              github.event.action == 'opened' ||
              (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-ci')) ||
              github.event.action == 'reopened' ||
              github.event.action == 'ready_for_review' ||
              (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          category: /language:${{ matrix.language }}
