name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # `full-ci` lifetime is intentionally asymmetric across the workflows
    # (pinned in tools/check_ci_review_contract.py so it cannot drift):
    # The application and Socket jobs in ci.yml honor the label ONE-SHOT (only
    # at the `labeled` event; a later plain `synchronize` drops back to the
    # quick lane / skip) because they are the cost-gated lanes. CodeQL
    # is advisory and cheap, so it honors the label PERSISTENTLY — the
    # `synchronize` arm below re-reads the label set on every push while the
    # label is present (contains(...labels...), not just github.event.label on
    # the labeled event), keeping security analysis running for the life of a
    # flagged PR. Do not "unify" by making CodeQL one-shot: that reduces
    # security coverage, the wrong direction for a scanner.
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (
            github.event.pull_request.draft == false &&
            (
              github.event.action == 'opened' ||
              (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'full-ci')) ||
              github.event.action == 'reopened' ||
              github.event.action == 'ready_for_review' ||
              (github.event.action == 'labeled' && github.event.label.name == 'full-ci')
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}
