name: Internal review gate

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - converted_to_draft
      - labeled
      - unlabeled
      - synchronize

permissions:
  pull-requests: read
  issues: read

jobs:
  require-internal-review:
    name: Require internal-review-passed label when ready
    runs-on: ubuntu-latest
    steps:
      - name: Check draft status and label
        env:
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request

          pr_number = os.environ["PR_NUMBER"]
          if os.environ.get("PR_DRAFT") == "true":
              print(f"PR #{pr_number} is a draft. Gate is satisfied; the Code Reviewer must add the \"internal-review-passed\" label before draft is removed.")
              sys.exit(0)

          labels = json.loads(os.environ.get("PR_LABELS", "[]"))
          if not any(label.get("name") == "internal-review-passed" for label in labels):
              print(f"::error::PR #{pr_number} is marked ready for review but is missing the \"internal-review-passed\" label.")
              print("::error::The Code Reviewer agent must sign off in the worktree and add this label before the PR is taken out of draft. See CLAUDE.md, \"Reviewer-before-ready gate\".")
              sys.exit(1)

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_author = os.environ["PR_AUTHOR"]

          req = urllib.request.Request(f"https://api.github.com/repos/{repo}/issues/{pr_number}/events?per_page=100")
          req.add_header("Authorization", f"Bearer {token}")
          req.add_header("Accept", "application/vnd.github.v3+json")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")

          try:
              with urllib.request.urlopen(req) as resp:
                  events = json.loads(resp.read())
              
              adder = None
              for event in events:
                  if event.get("event") == "labeled" and event.get("label", {}).get("name") == "internal-review-passed":
                      adder = event.get("actor", {}).get("login")
              
              if adder == pr_author:
                  print(f"::error::The \"internal-review-passed\" label was added by the PR author ({adder}). It must be added by a different Code Reviewer.")
                  sys.exit(1)
          except Exception as e:
              print(f"Warning: Could not verify label actor via API: {e}")

          print(f"PR #{pr_number} is ready for review and carries the \"internal-review-passed\" label. Gate passed.")
          '
