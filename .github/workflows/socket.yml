name: Socket Security

# Socket supply-chain scan, run as a CI sidecar alongside the `test` gate.
# It flags risky dependency *changes* — install scripts, new network/fs/shell
# capabilities, typosquats, compromised releases — that Dependabot's CVE-only
# scanning can't see. Once `socket` is a required check, a poisoned Dependabot
# bump fails the merge instead of auto-merging.
#
# Setup (one-time): create a Socket CI/CD API key
# (https://docs.socket.dev/docs/create-socket-api-key-for-cicd) and add it as
# the repo secret SOCKET_SECURITY_API_KEY (Settings -> Secrets and variables
# -> Actions). Until then this job no-ops to success so it never blocks merges
# before Socket is configured.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: socket-${{ github.ref }}
  cancel-in-progress: true

jobs:
  socket:
    name: socket
    runs-on: ubuntu-latest
    steps:
      # Secrets can't be referenced in a job/step `if:`, so gate on a step
      # output instead: with no key the real steps skip and the job still
      # concludes success (a green required check, not a blocking "skipped").
      - name: Check for Socket API key
        id: key
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SOCKET_SECURITY_API_KEY not set — skipping scan. Add the secret to enable the Socket gate."
          fi

      - name: Checkout
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v6
        with:
          # Socket diffs the PR head against its base; depth 2 covers the
          # single-commit case without a full-history fetch.
          fetch-depth: 2

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Socket CLI
        if: steps.key.outputs.present == 'true'
        # `python -m pip` (not bare `pip`) guarantees the install targets the
        # interpreter actions/setup-python just selected, regardless of PATH.
        run: python -m pip install socketsecurity==2.1.0

      - name: Run Socket scan
        if: steps.key.outputs.present == 'true'
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: socketcli --target-path "$GITHUB_WORKSPACE" --scm github --pr-number "$PR_NUMBER"
