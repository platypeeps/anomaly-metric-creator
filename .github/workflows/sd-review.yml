name: SD routed review

on:
  workflow_dispatch:
    inputs:
      review-request:
        description: Canonical sd-github-review v1 request JSON
        required: true
        type: string
      operation:
        description: Route a review or query an existing exact-head receipt
        required: true
        default: route
        type: choice
        options: [route, query]
      rerequest-authorized:
        description: Authorize a validated same-head request with attempt greater than one
        required: false
        default: false
        type: boolean
      # There is deliberately no `independent-review-floor` input here. The
      # floor is the repository's minimum automatic route, and the caller it
      # constrains is a workflow_dispatch caller -- so offering it on the
      # dispatch form handed that caller its own minimum. It reads from
      # REVIEW_INDEPENDENT_FLOOR below, exactly as route-policy reads from
      # REVIEW_ROUTE_MODE. Repository variables cannot be set from a dispatch
      # form; that asymmetry is the entire point of both.

# Least privilege by default; each job widens only to what it needs. The
# receipt-writing jobs (review, finalize) hold checks:write; the third-party
# reviewer job (pr-agent) never does, so a compromised reviewer cannot forge
# durable receipts.
permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      adapter-request: ${{ steps.review.outputs.adapter-request }}
      backend-id: ${{ steps.review.outputs.backend-id }}
      model: ${{ steps.review.outputs.model }}
      pull-request-number: ${{ steps.review.outputs.pull-request-number }}
    steps:
      # Same shape as the REVIEW_ROUTE_MODE guard in the event-driven lane, and
      # for the same reason: a policy bound the lane cannot read is a policy the
      # lane does not enforce. Failing here rather than inside the action gets
      # the operator an error naming the variable to set, instead of one naming
      # an action input they never supplied.
      #
      # The action does already reject an empty value -- `input()` uses `??`, so
      # an unset variable arrives as "" rather than as absent, and normalizeMode
      # throws on it. This step is not what makes the lane fail closed; it is
      # what makes the failure legible, and it holds if that decoder ever
      # changes.
      - name: Require an explicit review floor
        env:
          REVIEW_INDEPENDENT_FLOOR: ${{ vars.REVIEW_INDEPENDENT_FLOOR }}
        run: |
          case "$REVIEW_INDEPENDENT_FLOOR" in
            none|cheap|deep|copilot)
              echo "Independent review floor: $REVIEW_INDEPENDENT_FLOOR"
              ;;
            "")
              echo "::error::Repository variable REVIEW_INDEPENDENT_FLOOR is not set. It is the minimum route this repository's automatic review may select, and this lane will not guess one. Set it to copilot to guarantee an independent review on every routed pull request, or to none to disable the floor." >&2
              exit 1
              ;;
            *)
              echo "::error::Repository variable REVIEW_INDEPENDENT_FLOOR must be one of none, cheap, deep, or copilot; got '$REVIEW_INDEPENDENT_FLOOR'." >&2
              exit 1
              ;;
          esac

      - name: Route or query the exact-head review
        id: review
        # Current release; upgrade every first-party reference together.
        uses: platypeeps/sd-github-review@6ba1eff049962faded1c289f666ef56b58c61b4d
        with:
          github-token: ${{ github.token }}
          operation: ${{ inputs.operation }}
          review-request: ${{ inputs.review-request }}
          cheap-backend: ${{ vars.SD_REVIEW_CHEAP_BACKEND_V1 }}
          deep-backend: ${{ vars.SD_REVIEW_DEEP_BACKEND_V1 }}
          rerequest-authorized: ${{ inputs.rerequest-authorized }}
          allow-bookkeeping-none: ${{ vars.SD_REVIEW_ALLOW_BOOKKEEPING_NONE || 'false' }}
          # Both policy bounds read from repository variables, never from a
          # workflow_dispatch input. They are opposite bounds on the same
          # decision -- the floor is the minimum automatic route, the policy is
          # the maximum a caller may explicitly request -- and in both cases the
          # caller they constrain is the workflow_dispatch caller. Sourcing
          # either from `inputs.` hands that caller its own bound and silently
          # disables it. Repository variables cannot be set from a dispatch
          # form; that is what makes them bounds at all.
          #
          # The floor was wired to `inputs.independent-review-floor` through
          # 0.5.0 and anyone who could dispatch could select `none`. Do not
          # reintroduce it for symmetry with the payload inputs above; a test
          # asserts this lane declares no such input, and another asserts the
          # key below is still passed -- omitting it entirely reaches the
          # action's `"none"` default and unfloors the lane just as quietly.
          independent-review-floor: ${{ vars.REVIEW_INDEPENDENT_FLOOR }}
          route-policy: ${{ vars.REVIEW_ROUTE_MODE }}
          high-risk-route: deep

  pr-agent:
    needs: review
    if: needs.review.outputs.adapter-request != ''
    runs-on: ubuntu-latest
    # Reviewer isolation: no checks:write, so the token handed to the
    # third-party container cannot write durable receipts. That single scope is
    # the whole boundary -- receipts are check runs, and nothing else the
    # container can reach forges one.
    #
    # This job once also withheld issues:write, and the comment named it as part
    # of the isolation. It was never isolation: on a pull request,
    # pull-requests:write already covers the /issues/... REST paths -- comments,
    # labels, reactions, comment edits -- because that prefix reflects GitHub
    # modelling pull requests as issues in the REST layout, not the permission
    # scope that governs them. Withholding issues:write therefore denied the
    # container nothing, while the sibling router lane granted it and the docs
    # told operators it was required to publish. Probed and removed in 0.6.1.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Validate PR-Agent configuration
        id: pr-agent-config
        env:
          REVIEW_BACKEND_ID: ${{ needs.review.outputs.backend-id }}
          REVIEW_MODEL_PROVIDER: ${{ vars.PR_AGENT_MODEL_PROVIDER }}
          REVIEW_MODEL: ${{ needs.review.outputs.model }}
        run: |
          if [ "$REVIEW_BACKEND_ID" != "pr-agent" ]; then
            echo "The selected external backend must use id pr-agent." >&2
            exit 1
          fi
          if [ -z "$REVIEW_MODEL" ]; then
            echo "The selected PR-Agent backend must declare a model." >&2
            exit 1
          fi
          case "$REVIEW_MODEL_PROVIDER" in
            openai)
              REVIEW_MODEL_PREFIX=""
              ;;
            gemini|openrouter|anthropic|cohere|replicate|groq|sambanova|xai|deepseek|deepinfra|mistral|codestral)
              REVIEW_MODEL_PREFIX="${REVIEW_MODEL_PROVIDER}/"
              ;;
            *)
              echo "PR_AGENT_MODEL_PROVIDER must select a supported single-key provider." >&2
              exit 1
              ;;
          esac
          if [ -n "$REVIEW_MODEL_PREFIX" ]; then
            case "$REVIEW_MODEL" in
              "$REVIEW_MODEL_PREFIX"*) ;;
              *)
                echo "The selected PR-Agent model must use the ${REVIEW_MODEL_PREFIX}<model-id> format." >&2
                exit 1
              ;;
            esac
          fi

      - name: Run PR-Agent review
        id: pr-agent
        if: steps.pr-agent-config.outcome == 'success'
        env:
          GITHUB__USER_TOKEN: ${{ github.token }}
          OPENAI__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'openai' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          GOOGLE_AI_STUDIO__GEMINI_API_KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'gemini' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          OPENROUTER__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'openrouter' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          ANTHROPIC__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'anthropic' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          COHERE__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'cohere' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          REPLICATE__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'replicate' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          GROQ__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'groq' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          SAMBANOVA__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'sambanova' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          XAI__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'xai' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          DEEPSEEK__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'deepseek' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          DEEPINFRA__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'deepinfra' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          MISTRAL__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'mistral' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          CODESTRAL__KEY: ${{ vars.PR_AGENT_MODEL_PROVIDER == 'codestral' && secrets.PR_AGENT_MODEL_API_KEY || '' }}
          CONFIG__MODEL: ${{ needs.review.outputs.model }}
          CONFIG__FALLBACK_MODELS: '[]'
          CONFIG__RESTRICTED_MODE: "true"
          REVIEW_PULL_REQUEST_NUMBER: ${{ needs.review.outputs.pull-request-number }}
        run: |
          docker run --rm \
            --env GITHUB__USER_TOKEN \
            --env OPENAI__KEY \
            --env GOOGLE_AI_STUDIO__GEMINI_API_KEY \
            --env OPENROUTER__KEY \
            --env ANTHROPIC__KEY \
            --env COHERE__KEY \
            --env REPLICATE__KEY \
            --env GROQ__KEY \
            --env SAMBANOVA__KEY \
            --env XAI__KEY \
            --env DEEPSEEK__KEY \
            --env DEEPINFRA__KEY \
            --env MISTRAL__KEY \
            --env CODESTRAL__KEY \
            --env CONFIG__MODEL \
            --env CONFIG__FALLBACK_MODELS \
            --env CONFIG__RESTRICTED_MODE \
            pragent/pr-agent@sha256:cae31b51b65b5c978a3b2a978d96e89e6a4c5bcd81cb2553fd8dad0251c3a23e \
            --pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${REVIEW_PULL_REQUEST_NUMBER}" \
            review

  finalize:
    needs: [review, pr-agent]
    if: needs.review.outputs.adapter-request != '' && always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Build the PR-Agent acknowledgment
        id: acknowledge
        uses: platypeeps/sd-github-review@6ba1eff049962faded1c289f666ef56b58c61b4d
        with:
          github-token: ${{ github.token }}
          operation: acknowledge
          adapter-request: ${{ needs.review.outputs.adapter-request }}
          adapter-outcome: ${{ needs.pr-agent.result }}

      - name: Finalize the external receipt
        uses: platypeeps/sd-github-review@6ba1eff049962faded1c289f666ef56b58c61b4d
        with:
          github-token: ${{ github.token }}
          operation: finalize
          review-request: ${{ inputs.review-request }}
          adapter-acknowledgment: ${{ steps.acknowledge.outputs.adapter-acknowledgment }}
