name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, auto_merge_enabled]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded in-progress runs on the same ref to save Actions minutes.
# Pushes group by commit instead: during a merge burst, a newer merge must not
# cancel the previous merge commit's full-suite backstop run, or a mid-burst
# regression is detected late and attributed to the wrong merge.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: classify changes
    runs-on: ubuntu-latest
    # Every lane `needs: changes`; a hung checkout/fetch here would otherwise
    # hold the required `test` context pending for the 6h default.
    timeout-minutes: 10
    outputs:
      lightweight_only: ${{ steps.classify.outputs.lightweight_only }}
      app_required: ${{ steps.classify.outputs.app_required }}
      dependency_changed: ${{ steps.classify.outputs.dependency_changed }}
      workflow_changed: ${{ steps.classify.outputs.workflow_changed }}
      full_ci_requested: ${{ steps['full-ci'].outputs.full_ci_requested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv for change and repository guards
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Check pull request branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: uv run --python 3.14 --no-project python tools/check_branch_name.py "$HEAD_REF"

      - name: Run lightweight repository guards
        shell: bash
        run: |
          set -euo pipefail

          amc_test_files=()
          while IFS= read -r path; do
            amc_test_files+=("$path")
          done < <(git ls-files 'tests/*.py')
          if [ "${#amc_test_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_amc_module_load.py "${amc_test_files[@]}"
            uv run --python 3.14 --no-project python tools/check_test_resource_cost.py "${amc_test_files[@]}"
          fi

          role_name_files=()
          while IFS= read -r path; do
            role_name_files+=("$path")
          done < <(git ls-files src scripts .agents .trellis)
          if [ "${#role_name_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_role_name_leaks.py "${role_name_files[@]}"
          fi

          hook_files=()
          while IFS= read -r path; do
            hook_files+=("$path")
          done < <(git ls-files '.codex/hooks/*.py' '.github/copilot/hooks/*.py' '.gemini/hooks/*.py')
          if [ "${#hook_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_agent_hook_exceptions.py "${hook_files[@]}"
          fi

      - name: Collect changed files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # Full history (no --depth=1): the checkout above uses
            # fetch-depth: 0, so a shallow re-fetch re-shallows
            # origin/$BASE_REF and the three-dot merge-base fails with
            # `fatal: origin/$BASE_REF...HEAD: no merge base` once this branch
            # falls behind the base (07-06 finding on PR #219, after #218
            # merged mid-lane). Fall back to a two-dot diff if the merge-base
            # still can't be computed; --name-only exits 0 on success and only
            # non-zero on that git error, so the || cannot mask a real diff.
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt \
              || git diff --name-only "origin/$BASE_REF" HEAD > changed-files.txt
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > changed-files.txt
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --name-only HEAD^ HEAD > changed-files.txt
          else
            git ls-files > changed-files.txt
          fi
          sed 's/^/- /' changed-files.txt

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier_args=(--github-output)
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            classifier_args+=(--force-app)
          fi
          bash scripts/classify-ci-changes.sh "${classifier_args[@]}" changed-files.txt

      - name: Decide full CI cadence
        id: full-ci
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_LABEL: ${{ github.event.label.name || '' }}
          PR_AUTO_MERGE: ${{ github.event.pull_request.auto_merge != null }}
          DEPENDENCY_CHANGED: ${{ steps.classify.outputs.dependency_changed }}
          WORKFLOW_CHANGED: ${{ steps.classify.outputs.workflow_changed }}
        run: |
          set -euo pipefail
          full_ci_requested=false

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            full_ci_requested=true
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            case "$PR_ACTION" in
              opened|reopened|ready_for_review)
                if [ "$PR_DRAFT" != "true" ]; then
                  full_ci_requested=true
                fi
                ;;
              # `full-ci` is honored ONE-SHOT here: only at the `labeled`
              # event, via github.event.label.name. A later plain
              # `synchronize` does NOT re-read the label set, so a flagged PR
              # that pushes again drops back to the quick lane unless
              # auto-merge is armed or dependency/workflow files changed. This
              # is deliberate (the full matrix is cost-gated) and asymmetric
              # with codeql.yml's persistent re-check — the split is pinned in
              # tools/check_ci_review_contract.py.
              labeled)
                if [ "$PR_LABEL" = "full-ci" ] || [ "$PR_AUTO_MERGE" = "true" ]; then
                  full_ci_requested=true
                fi
                ;;
              # Auto-merge lands the PR the moment required contexts go
              # green, so pushes to an armed PR must gate on the full
              # matrix, never the quick lane. auto_merge is frozen into
              # the event payload at delivery; arming after the push is
              # covered by the auto_merge_enabled case below.
              synchronize)
                if [ "$PR_AUTO_MERGE" = "true" ]; then
                  full_ci_requested=true
                fi
                ;;
              # Arming auto-merge re-gates the current head on the full
              # matrix (cancel-in-progress supersedes any quick run on
              # this ref). Arm at PR-open time for the cheap path; arming
              # after a green full lane costs one redundant full run.
              auto_merge_enabled)
                full_ci_requested=true
                ;;
            esac
          fi

          if [ "$DEPENDENCY_CHANGED" = "true" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            full_ci_requested=true
          fi

          echo "full_ci_requested=$full_ci_requested" >> "$GITHUB_OUTPUT"
          echo "full_ci_requested=$full_ci_requested"

  lightweight_readiness:
    name: lightweight readiness
    needs: changes
    if: needs.changes.outputs.lightweight_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up uv for lightweight guards
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Whitespace check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            # Full history (no --depth=1) so the three-dot merge-base resolves
            # when this branch is behind the base (same #219 flaw as the
            # classifier's collect step). No two-dot fallback here: `git diff
            # --check` exits 1 on a real whitespace error, so a `|| two-dot`
            # would swallow legitimate failures, not just the merge-base error.
            git fetch --no-tags origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
            git diff --check "origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

      - name: Shell syntax for review tooling
        run: bash -n scripts/classify-ci-changes.sh scripts/classify_ci_changes.sh scripts/sd-ai-command-pack-full-check.sh scripts/sd-ai-command-pack-housekeeping.sh scripts/sd-ai-command-pack-review-scope.sh scripts/sd-ai-command-pack-review-local.sh scripts/sd-ai-command-pack-shell-lib.sh scripts/sd-ai-command-pack-toolchain.sh

      - name: Smoke CI classifier
        run: |
          printf '%s\n' \
            'docs/REVIEW_PATTERNS.md' \
            '.github/prompts/review-pr.prompt.md' \
            'scripts/sd-ai-command-pack-full-check.sh' > /tmp/lightweight-changes.txt
          bash scripts/classify-ci-changes.sh /tmp/lightweight-changes.txt > /tmp/classifier.out
          grep -q '^lightweight_only=true$' /tmp/classifier.out
          grep -q '^app_required=false$' /tmp/classifier.out

      - name: Syntax and Trellis artifact guards
        shell: bash
        run: |
          set -euo pipefail

          python_files=()
          while IFS= read -r path; do
            python_files+=("$path")
          done < <(git ls-files 'scripts/*.py' 'tools/*.py' 'tests/*.py' '.codex/hooks/*.py' '.github/copilot/hooks/*.py' '.gemini/hooks/*.py')
          if [ "${#python_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_python_syntax.py "${python_files[@]}"
          fi

          workflow_files=()
          while IFS= read -r path; do
            workflow_files+=("$path")
          done < <(git ls-files '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#workflow_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_workflow_pip.py "${workflow_files[@]}"
          fi

          trellis_files=()
          while IFS= read -r path; do
            trellis_files+=("$path")
          done < <(git ls-files .trellis/tasks .trellis/workspace | grep -E '\.(md|json|jsonl|ya?ml|toml)$' || true)
          if [ "${#trellis_files[@]}" -gt 0 ]; then
            uv run --python 3.14 --no-project python tools/check_trellis_placeholders.py "${trellis_files[@]}"
          fi

          uv run --python 3.14 --no-project python tools/check_ci_review_contract.py
          uv run --python 3.14 --no-project python tools/check_copilot_instruction_contract.py
          uv run --python 3.14 --no-project python scripts/sd-ai-command-pack-pr-body-scope.py

  quick_check:
    name: quick test
    needs: changes
    if: needs.changes.outputs.app_required == 'true' && needs.changes.outputs.full_ci_requested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies (dev extra)
        # --locked fails the job if pyproject.toml and uv.lock disagree,
        # instead of silently re-resolving in the runner. Keeps the
        # committed lock authoritative (07-06-uv-locked-ci-enforcement).
        run: uv sync --extra dev --locked --python 3.14

      - name: Smoke installed console scripts
        run: |
          uv venv --python 3.14 .ci-package-smoke
          uv pip install --python .ci-package-smoke/bin/python .
          .ci-package-smoke/bin/amc --help > /dev/null
          .ci-package-smoke/bin/anomaly-metric-creator --help > /dev/null

      - name: Check ruff version lockstep
        run: uv run --no-sync python tools/check_ruff_lockstep.py

      - name: Lint tests (ruff F401)
        run: uv run --no-sync ruff check tests/

      # Mirror the pre-commit `ruff F841` hook (unused locals) on runtime, tool,
      # and hook-adapter code. Local hooks are not a CI gate, so a contributor
      # who skips `pre-commit install` would otherwise bypass F841 on src/.
      # F401 stays tests-only by design: the facade modules (combine.py, etc.)
      # re-export names that read as "unused imports", so F401 on src/ is wrong.
      - name: Lint runtime/tools (ruff F841)
        run: uv run --no-sync ruff check --select F841 src tools .codex/hooks .github/copilot/hooks .gemini/hooks

      - name: Run quick review-churn tests
        run: |
          uv run --no-sync pytest -q \
            tests/test_ci_change_classifier.py \
            tests/test_python_syntax_lint.py \
            tests/test_workflow_pip_lint.py \
            tests/test_ci_review_contract.py \
            tests/test_copilot_instruction_contract.py \
            tests/test_pr_body_scope_lint.py \
            tests/test_ruff_lockstep_lint.py \
            tests/test_trellis_placeholder_lint.py \
            tests/test_trace_payload_antipatterns_lint.py
          uv run --no-sync pytest -q tests/test_server.py -k "apply or rollout"

  test_heavy:
    name: test heavy (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.app_required == 'true' && needs.changes.outputs.full_ci_requested == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Tested version policy: latest stable CPython only (decided
        # 2026-07-06). pyproject requires-python is >=3.14 — the floor and
        # the validated version are the same; bump both together when a new
        # stable CPython lands.
        python-version: ["3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        # enable-cache uses the Actions cache service, which authenticates
        # with the runtime token (ACTIONS_RUNTIME_TOKEN) independent of the
        # `permissions:` block above.
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}

      # Two loadfile-distributed workers keep file-owned GB-scale fixtures
      # together. Hosted trial 29798826800 measured 5.09 GiB peak used memory
      # and 76.9 GiB post-run free disk, clearing the pre-committed 12 GiB / 2
      # GiB adoption thresholds. Pytest exit 5 still makes an empty heavy
      # partition a hard failure if marker assignment ever drifts.
      - name: Run heavy test partition
        env:
          COVERAGE_CORE: sysmon
        run: uv run --no-sync pytest -n 2 --dist loadfile -m heavy --cov=src/anomaly_metric_creator --cov-report=

      # upload-artifact excludes hidden files by default, so expose the raw
      # coverage data under a visible, lane-specific filename first.
      - name: Prepare heavy coverage data
        run: mv .coverage coverage-heavy

      - name: Upload heavy coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-heavy
          path: coverage-heavy
          if-no-files-found: error

  test_light:
    name: test light (py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.app_required == 'true' && needs.changes.outputs.full_ci_requested == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Tested version policy: latest stable CPython only. Keep this in
        # lockstep with requires-python and the heavy lane.
        python-version: ["3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev --locked --python ${{ matrix.python-version }}

      # Pinned real-client compatibility contract (07-17-audit-real-client-smoke-ci).
      # When either client moves, update its checksum, the advertised Kubernetes
      # version, README compatibility evidence, and the pinned-tools checklist.
      - name: Install pinned real Kubernetes clients
        env:
          KUBECTL_VERSION: v1.36.2
          KUBECTL_SHA256: 1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82
          HELM_VERSION: v4.2.0
          HELM_SHA256: 97dbeb971be4ac4b27e3839976d9564c0fb35c6f3b1da89dd1e292d236af4096
        run: |
          set -euo pipefail
          client_root="$RUNNER_TEMP/amc-real-clients"
          client_bin="$client_root/bin"
          mkdir -p "$client_bin"

          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
            --output "$client_bin/kubectl"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$client_bin/kubectl" \
            | sha256sum --check --strict
          chmod 0755 "$client_bin/kubectl"

          curl --fail --location --show-error --silent \
            --retry 3 --retry-all-errors \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$client_root/helm.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$client_root/helm.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$client_root/helm.tar.gz" -C "$client_root" linux-amd64/helm
          install -m 0755 "$client_root/linux-amd64/helm" "$client_bin/helm"

          "$client_bin/kubectl" version --client
          "$client_bin/helm" version --short
          echo "$client_bin" >> "$GITHUB_PATH"

      - name: Run pinned real kubectl and Helm smokes
        env:
          AMC_RUN_REAL_CLIENT_SMOKE: "1"
        run: |
          uv run --no-sync pytest -n 0 -q \
            tests/test_server.py::test_real_helm4_binary_smoke_when_available \
            tests/test_server.py::test_real_kubectl_binary_smoke_when_available

      - name: Smoke installed console scripts
        run: |
          uv venv --python ${{ matrix.python-version }} .ci-package-smoke
          uv pip install --python .ci-package-smoke/bin/python .
          .ci-package-smoke/bin/amc --help > /dev/null
          .ci-package-smoke/bin/anomaly-metric-creator --help > /dev/null

      # Fail before the long suite if ruff's two pins have drifted
      # (pyproject `ruff==` vs the pre-commit `rev:`).
      - name: Check ruff version lockstep
        run: uv run --no-sync python tools/check_ruff_lockstep.py

      # Lint tests/ for unused imports (F401). The pre-commit hook covers
      # this at commit time, but contributors who skip `pre-commit install`
      # would otherwise bypass the check entirely.
      - name: Lint tests (ruff F401)
        run: uv run --no-sync ruff check tests/

      # Mirror the pre-commit `ruff F841` hook (unused locals) on runtime, tool,
      # and hook-adapter code — the same scope the quick lane runs. F401 stays
      # tests-only by design (the src/ facade re-exports would trip it).
      - name: Lint runtime/tools (ruff F841)
        run: uv run --no-sync ruff check --select F841 src tools .codex/hooks .github/copilot/hooks .gemini/hooks

      # Type-check in two steps (07-06-coverage-threshold-and-mypy-gating).
      # The report-only run surfaces the full mypy baseline on every
      # full-suite run — legacy.py + the server layer are the known-messy
      # ~137-error baseline — and never gates. Config: [tool.mypy] in
      # pyproject.toml.
      - name: Type-check baseline (mypy, report-only)
        continue-on-error: true
        run: uv run --no-sync mypy

      # Gate: the modules that are already mypy-clean must stay at zero
      # errors, so a regression in one of them fails the build.
      # --follow-imports=silent type-checks their imports for inference but
      # reports only errors originating in the listed files, so importing a
      # still-dirty module (e.g. legacy.py) does not leak its errors here.
      # Add a module to this list once it reaches zero errors (the set grows
      # as 07-02-legacy-monolith-decomposition extracts clean modules); never
      # drop one to silence a regression — fix the type error instead.
      - name: Type-check gate (mypy, clean modules)
        run: uv run --no-sync python tools/check_mypy_gate.py

      # The light remainder runs under real xdist to retain coverage of the
      # parallel worker-distribution and global-state ordering path.
      - name: Run light test partition
        env:
          COVERAGE_CORE: sysmon
        run: uv run --no-sync pytest -n 2 --dist loadfile -m "not heavy" --cov=src/anomaly_metric_creator --cov-report=

      - name: Prepare light coverage data
        run: mv .coverage coverage-light

      - name: Upload light coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-data-light
          path: coverage-light
          if-no-files-found: error

  coverage_combine:
    name: coverage (py3.14)
    needs: [test_heavy, test_light]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev --locked --python 3.14

      - name: Download heavy coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-data-heavy
          path: coverage-data

      - name: Download light coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: coverage-data-light
          path: coverage-data

      - name: Combine coverage data
        run: |
          mv coverage-data/coverage-heavy .coverage.heavy
          mv coverage-data/coverage-light .coverage.light
          uv run --no-sync coverage combine

      # Generate XML before the threshold step: if the 85% ratchet trips,
      # the later !cancelled() upload still publishes the diagnostic report.
      - name: Generate coverage XML
        run: uv run --no-sync coverage xml

      - name: Enforce coverage threshold
        run: uv run --no-sync coverage report --fail-under=85

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml-py3.14
          path: coverage.xml
          if-no-files-found: error

  # Collection catches import-time POSIX assumptions without paying for a
  # second full test platform. This lane is intentionally advisory: it is not
  # a dependency of `test` or the required `CI Result`, and continue-on-error
  # keeps a Windows-only defect visible without changing branch protection.
  windows_collection:
    name: Windows collection (advisory)
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev --locked --python 3.14

      - name: Collect tests
        run: uv run --no-sync pytest --collect-only -q

  socket:
    name: socket
    needs: changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    timeout-minutes: 15
    steps:
      - name: Decide whether to scan
        id: scan
        shell: bash
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          PR_LABEL: ${{ github.event.label.name || '' }}
          DEPENDENCY_CHANGED: ${{ needs.changes.outputs.dependency_changed }}
          WORKFLOW_CHANGED: ${{ needs.changes.outputs.workflow_changed }}
        run: |
          set -euo pipefail
          scan=false

          case "$PR_ACTION" in
            opened|reopened|ready_for_review)
              if [ "$PR_DRAFT" != "true" ]; then
                scan=true
              fi
              ;;
            labeled)
              if [ "$PR_LABEL" = "full-ci" ]; then
                scan=true
              fi
              ;;
          esac

          if [ "$DEPENDENCY_CHANGED" = "true" ] || [ "$WORKFLOW_CHANGED" = "true" ]; then
            scan=true
          fi

          echo "scan=$scan" >> "$GITHUB_OUTPUT"
          echo "scan=$scan"
          if [ "$scan" != "true" ]; then
            echo "::notice::No dependency/security-relevant changes and full CI was not requested; skipping Socket scan."
          fi

      - name: Check for Socket API key
        id: key
        if: steps.scan.outputs.scan == 'true'
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          if [ -n "$SOCKET_SECURITY_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SOCKET_SECURITY_API_KEY not set; skipping scan. Add the secret to enable the Socket gate."
          fi

      - name: Checkout
        if: steps.scan.outputs.scan == 'true' && steps.key.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        if: steps.scan.outputs.scan == 'true' && steps.key.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Socket CLI
        if: steps.scan.outputs.scan == 'true' && steps.key.outputs.present == 'true'
        run: python -m pip install socketsecurity==2.1.0

      - name: Run Socket scan
        if: steps.scan.outputs.scan == 'true' && steps.key.outputs.present == 'true'
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: socketcli --target-path "$GITHUB_WORKSPACE" --scm github --pr-number "$PR_NUMBER"

  test:
    name: test
    needs: [changes, lightweight_readiness, quick_check, test_heavy, test_light, coverage_combine]
    # !cancelled(), not always(): when concurrency cancel-in-progress
    # supersedes this run — e.g. arming auto-merge triggers a fresh full run
    # on the same head — this aggregate is cancelled WITH the run, so the
    # application aggregate reports "cancelled", not a spurious FAILURE.
    # always() would run this job even during cancellation and evaluate
    # `test "cancelled" = "success"` -> exit 1, flashing a transient red on
    # every auto-merge-armed PR (07-03-ci-cadence-churn-refinement, symptom
    # 1). A "cancelled" required check does not satisfy branch protection, so
    # auto-merge still waits for the superseding run's real verdict; a genuine
    # lane failure is not a cancellation, so this aggregate still runs and
    # fails on it. Do not revert to always() — the churn returns.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # Trivial gate job (echoes + one status check); a hang here holds the
    # application result that feeds CI Result, so cap it well under the default.
    timeout-minutes: 5
    steps:
      # Keep the path-selected jobs above for visibility, then fail this
      # application aggregate unless the selected lane completed successfully.
      - name: Check selected CI lane
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LIGHTWEIGHT_RESULT: ${{ needs.lightweight_readiness.result }}
          QUICK_RESULT: ${{ needs.quick_check.result }}
          HEAVY_RESULT: ${{ needs.test_heavy.result }}
          LIGHT_RESULT: ${{ needs.test_light.result }}
          COVERAGE_RESULT: ${{ needs.coverage_combine.result }}
          LIGHTWEIGHT_ONLY: ${{ needs.changes.outputs.lightweight_only }}
          APP_REQUIRED: ${{ needs.changes.outputs.app_required }}
          FULL_CI_REQUESTED: ${{ needs.changes.outputs.full_ci_requested }}
        run: |
          set -euo pipefail

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes result: $CHANGES_RESULT"
            exit 1
          fi

          if [ "$APP_REQUIRED" = "true" ] && [ "$FULL_CI_REQUESTED" = "true" ]; then
            echo "selected lane: full test lanes"
            test "$HEAVY_RESULT" = "success"
            test "$LIGHT_RESULT" = "success"
            test "$COVERAGE_RESULT" = "success"
          elif [ "$APP_REQUIRED" = "true" ]; then
            echo "selected lane: quick test"
            test "$QUICK_RESULT" = "success"
          elif [ "$LIGHTWEIGHT_ONLY" = "true" ]; then
            echo "selected lane: lightweight readiness"
            test "$LIGHTWEIGHT_RESULT" = "success"
          else
            echo "no CI lane selected"
            exit 1
          fi

  ci_result:
    name: CI Result
    needs: [test, socket]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APP_RESULT: ${{ needs.test.result }}
          SOCKET_RESULT: ${{ needs.socket.result }}
        run: |
          set -euo pipefail
          echo "application=$APP_RESULT"
          echo "socket=$SOCKET_RESULT"

          test "$APP_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$SOCKET_RESULT" = "success"
          else
            test "$SOCKET_RESULT" = "skipped"
          fi

          echo "CI Result passed."
