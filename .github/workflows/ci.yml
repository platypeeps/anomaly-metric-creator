name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded in-progress runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-matrix:
    name: test (py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # Pushes to main use the org-configured 16 GB larger runner so the default
    # xdist suite stays fast. Pull requests use the standard runner with a
    # serial pytest override below: the larger-runner label can sit queued with
    # runner_id=0 before any steps start, which blocks branch protection even
    # though the suite itself is healthy.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'ubuntu-latest-m' }}
    # PRs run the slower low-RAM fallback (~24 min historically), while main
    # pushes stay around 5-8 min on the larger runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        # enable-cache uses the Actions cache service, which authenticates
        # with the runtime token (ACTIONS_RUNTIME_TOKEN) — independent of the
        # `permissions:` block above. The job's `contents: read` therefore
        # does not disable or break dependency caching.
        with:
          enable-cache: true

      - name: Sync dependencies (dev extra)
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Smoke installed console scripts
        run: |
          uv venv --python ${{ matrix.python-version }} .ci-package-smoke
          uv pip install --python .ci-package-smoke/bin/python .
          .ci-package-smoke/bin/amc --help > /dev/null
          .ci-package-smoke/bin/anomaly-metric-creator --help > /dev/null

      # Fail before the long suite if ruff's two pins have drifted
      # (pyproject `ruff==` vs the pre-commit `rev:`). lockfile-only
      # (PR #115) stopped Dependabot bumping the exact `ruff==` pin, so
      # only the pre-commit `rev` advances now — this guard turns that
      # drift into a red `test` check instead of a silent skew.
      - name: Check ruff version lockstep
        run: uv run --no-sync python tools/check_ruff_lockstep.py

      # Lint tests/ for unused imports (F401). The pre-commit hook covers
      # this at commit time, but contributors who skip `pre-commit install`
      # would otherwise bypass the check entirely.
      - name: Lint tests (ruff F401)
        run: uv run --no-sync ruff check tests/

      # PR standard runners need the low-RAM serial path; main pushes on the
      # larger runner keep the repo's default parallel config (pyproject
      # addopts `-n 4 --dist loadfile`).
      - name: Run test suite
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            uv run --no-sync pytest -n 0
          else
            uv run --no-sync pytest
          fi

  test:
    name: test
    needs: test-matrix
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      # Branch protection requires a stable `test` context. Keep the
      # version-specific jobs above for visibility, then fail this aggregate
      # unless every matrix leg completed successfully.
      - name: Check test matrix result
        run: |
          if [ "${{ needs.test-matrix.result }}" != "success" ]; then
            echo "test-matrix result: ${{ needs.test-matrix.result }}"
            exit 1
          fi
          echo "test-matrix result: ${{ needs.test-matrix.result }}"
