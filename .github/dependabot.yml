version: 2

updates:
  # Python deps — pyproject.toml + uv.lock (covers runtime deps AND the
  # `yaml` / `dev` extras: pytest, pytest-xdist, ruff, pre-commit, pyyaml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # All non-major bumps land in ONE weekly PR; majors stay individual
      # so they get a focused review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pre-commit hooks — updates the `rev:` of astral-sh/ruff-pre-commit.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore(pre-commit)"

  # GitHub Actions — uncomment once you add .github/workflows/*.
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "ci(deps)"
