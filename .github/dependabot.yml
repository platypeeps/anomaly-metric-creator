version: 2

updates:
  # Python deps — pyproject.toml + uv.lock (covers runtime deps AND the
  # `yaml` / `dev` extras: pytest, pytest-xdist, ruff, pre-commit, pyyaml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    # Update uv.lock to the new resolved versions but leave pyproject.toml's
    # loose `>=` floors alone — the committed lock is the pinned-version
    # source of truth, while the manifest stays broadly compatible. Without
    # this the uv ecosystem defaults to `increase`, which creeps the floors
    # on every release (e.g. numpy >=1.26 -> >=2.4.6).
    versioning-strategy: "lockfile-only"
    # prefix only — adding `include: "scope"` here doubles the conventional
    # scope into `chore(deps)(deps):`, since the prefix already carries it.
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All non-major bumps land in ONE weekly PR; majors stay individual
      # so they get a focused review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pre-commit hooks — updates the `rev:` of astral-sh/ruff-pre-commit.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore(pre-commit)"

  # GitHub Actions — uncomment once you add .github/workflows/*.
  # - package-ecosystem: "github-actions"
  #   directory: "/"
  #   schedule:
  #     interval: "weekly"
  #   commit-message:
  #     prefix: "ci(deps)"
