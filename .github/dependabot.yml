version: 2

updates:
  # Python deps — pyproject.toml + uv.lock (covers runtime deps AND the
  # `yaml` / `dev` extras: pytest, pytest-xdist, ruff, pre-commit, pyyaml).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    # Update uv.lock to the new resolved versions but leave pyproject.toml's
    # loose `>=` floors alone — the committed lock is the pinned-version
    # source of truth, while the manifest stays broadly compatible. Without
    # this the uv ecosystem defaults to `increase`, which creeps the floors
    # on every release (e.g. numpy >=1.26 -> >=2.4.6).
    versioning-strategy: "lockfile-only"
    # prefix only — adding `include: "scope"` here doubles the conventional
    # scope into `chore(deps)(deps):`, since the prefix already carries it.
    commit-message:
      prefix: "chore(deps)"
    groups:
      # All non-major bumps land in ONE weekly PR; majors stay individual
      # so they get a focused review.
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # pre-commit hooks — updates the `rev:` of astral-sh/ruff-pre-commit.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore(pre-commit)"

  # GitHub Actions — keep the workflow action pins (checkout, setup-uv,
  # fetch-metadata) fresh now that .github/workflows/ exists.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "ci(deps)"
    groups:
      # CodeQL's init and analyze actions must use the same revision. Group
      # them so Dependabot never opens two individually unmergeable PRs.
      codeql:
        patterns: ["github/codeql-action/*"]
    ignore:
      # The review-route pin is set by hand, not by Dependabot. The action runs
      # `bin/sd-review` out of the pinned checkout, so a bump is a behaviour
      # change across the whole pack, not a version number.
      #
      # rwbp-coordinator is the proof. It had no such entry, so Dependabot
      # bumped its pin from cada9b61 to 1ff2b049 unattended; that range
      # introduced a gate refusing any commit without an `Authored-with:`
      # trailer, `route` went red on the bump's own pull request, and it merged
      # anyway because `route` is advisory and `CI Result` was green. Every pull
      # request there was red for the next three days.
      #
      # The refusal itself is fixed upstream (platypeeps/sd-ai-command-pack#799,
      # carried by 505431b8). This entry is for the reason that outlives it: the
      # next behaviour change would arrive the same way.
      - dependency-name: "platypeeps/sd-ai-command-pack/actions/review-route"

  # No npm ecosystem entry: OpenCode regenerates .opencode/package.json
  # (pinned to the locally installed opencode version) and its lockfile on
  # every launch, so the manifest is a gitignored per-developer runtime
  # artifact, not a committed dependency for Dependabot to bump (audit A-043).
