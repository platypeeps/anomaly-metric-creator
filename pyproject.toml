[project]
name = "anomaly-metric-creator"
version = "0.1.0"
description = "Synthetic IoT-style metric log generator with built-in anomalies."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "opentelemetry-proto>=1.25.0",
  "protobuf>=5.27.0",
]

[project.optional-dependencies]
# Optional runtime extra: enables YAML --instance-config files
# (.yaml/.yml). JSON --instance-config works without this extra.
yaml = [
  "pyyaml>=6.0",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "numpy>=1.26",
  "opentelemetry-proto>=1.25.0",
  "protobuf>=5.27.0",
  "pyyaml>=6.0",
  "ruff==0.15.13",
  "pre-commit>=3.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-n 4 --dist loadfile` parallelizes the suite across 4 workers, distributing
# whole files per worker so session-scoped fixtures in tests/conftest.py
# (`one_day_run_a`, `seven_day_run`, `n3_one_day_dataset_dir`, ...) are
# materialized once per worker rather than once per fixture-using test file.
# The N=3 dataset alone is ~1.3 GB; 4 workers caps peak fixture RAM near
# ~5 GB. Override on the command line for narrow or wide hosts:
#   .venv/bin/pytest -n 1   # serial (debugging, low-RAM CI runners)
#   .venv/bin/pytest -n 8   # bigger boxes
# See VER-218 for the heartbeat-budget motivation.
addopts = "-ra --dist loadfile -n 4"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# F401 (unused imports) is configured repo-wide so that `ruff check`
# on any path picks up the same rule. Automated enforcement is scoped
# to tests/ via the .pre-commit-config.yaml hook (where the test-
# hygiene churn lives); non-test files are not linted by default.
# See CLAUDE.md "Pre-PR checklist > Test hygiene".
select = ["F401"]
