[project]
name = "anomaly-metric-creator"
version = "0.1.0"
description = "Synthetic IoT-style metric log generator with built-in anomalies."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "numpy>=1.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
