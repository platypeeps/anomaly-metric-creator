[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-metric-creator"
version = "0.4.0"
description = "Synthetic IoT-style metric log generator with built-in anomalies."
readme = "README.md"
# Latest-stable-only support policy (decided 2026-07-06): the project
# tracks the newest stable CPython; older versions are not supported or
# tested. Bump this floor when a new stable CPython lands.
requires-python = ">=3.14"
classifiers = [
  "Private :: Do Not Upload",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Monitoring",
]
# Floors are the oldest combination actually exercised under the sole
# supported interpreter (`requires-python >= 3.14`): pinned to the versions
# `uv.lock` currently resolves so the manifest cannot advertise a lower bound
# with no cp314 wheels (numpy 1.26 / protobuf 5.27 predate Python 3.14). Under
# `versioning-strategy: lockfile-only` Dependabot bumps the lock, not these
# floors, so they stay stable minimums. Keep the same floors in the `dev` and
# `yaml` extras below.
dependencies = [
  "numpy>=2.5.1",
  "opentelemetry-proto>=1.44.0",
  "protobuf>=7.35.1",
]

[project.scripts]
amc = "anomaly_metric_creator.cli:main"
anomaly-metric-creator = "anomaly_metric_creator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Optional runtime extra: enables YAML --instance-config files
# (.yaml/.yml). JSON --instance-config works without this extra.
yaml = [
  "pyyaml>=6.0.3",
]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "numpy>=2.5.1",
  "opentelemetry-proto>=1.44.0",
  "protobuf>=7.35.1",
  "pyyaml>=6.0.3",
  # Pinned exactly: must match `rev: vX.Y.Z` in `.pre-commit-config.yaml`
  # so a local `ruff check` and the `ruff-pre-commit` hook resolve the
  # same binary. Bump both lines together.
  "ruff==0.16.5",
  "pre-commit>=3.7.0",
  # Pinned exactly: CI runs mypy in a report-only baseline step (finding
  # count only comparable across runs when every run resolves the same mypy)
  # plus a gating step over the clean-module list owned by
  # `tools/check_mypy_gate.py`. Single pin site (no pre-commit hook), so no
  # lockstep script.
  "mypy==2.1.0",
  # Coverage measurement in CI's full-suite lane: the coverage job combines
  # the heavy/light partitions and gates with `coverage report
  # --fail-under=85`, a no-regression ratchet raised toward the measured
  # number as decomposition lands, never lowered to pass a red build.
  "pytest-cov>=7.0",
]

[tool.coverage.run]
# Heavy and light CI partitions run in separate checkouts/jobs. Store relative
# source paths so coverage.py can combine their independently produced data.
relative_files = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# `-n 4 --dist loadfile` is the measured local throughput default and keeps
# every test from a given file on one worker. Session fixtures are lazy and
# process-local, so a fixture used by multiple files can still be built on
# `min(consuming files, workers)` processes. `loadfile` prevents the worse
# per-test fan-out where one file can make every worker build the same fixture.
# Four workers are the practical saturation point for this file-granular suite;
# wider pools have not produced a material local speedup. A serial heavy
# partition avoids fixture fan-out but is a memory-conservative fallback, not a
# speed optimization: on the 2026-07-20 checkout it took 345.01s by itself,
# versus 253.36s for the complete default run. Override when needed:
#   .venv/bin/pytest -n 0   # in-process; required for pdb / true serial
#   .venv/bin/pytest -n 2   # lower-memory parallel fallback
# `required_plugins` makes the failure mode explicit: without
# `pytest-xdist` installed, the `addopts` `-n` flag would otherwise
# fail with a cryptic "unrecognized arguments" error.
required_plugins = ["pytest-xdist"]
# --strict-markers turns a typo'd or unregistered @pytest.mark.<name> into a
# collection error instead of a silent warning. Both markers used in the
# suite (full_resolution, heavy) are registered below.
addopts = "-ra --strict-markers --dist loadfile -n 4"
# Registered markers. These declarations exist so pytest's --strict-markers
# mode (and any lint that consumes the [tool.pytest.ini_options].markers
# list) treats the marker name as known; no conftest helper reads marker
# registrations at runtime. See CLAUDE.md "Test resource cost" for the
# cheap-default convention these markers attach to.
markers = [
  "full_resolution: declares the test depends on 1s rows (86,400/day); pairs with an explicit interval_seconds=1.0 at the run_capture call site. The script's --interval-seconds default is 60s, and interval_seconds=None inherits that default.",
  "heavy: auto-applied (tests/conftest.py pytest_collection_modifyitems) to any test whose fixture closure pulls a GB-scale fixture, or whose parametrized strings name a registered heavy fixture for indirect getfixturevalue lookup. The PR CI gate runs `-m heavy` and `-m \"not heavy\"` in separate loadfile-distributed xdist jobs so the parallel ordering path is exercised without OOM-ing the standard runner. Do not hand-apply.",
]

[tool.mypy]
# Report-only baseline for the annotated-but-unenforced codebase: CI runs
# `mypy` with continue-on-error so the finding count is visible on every
# full-suite run without gating merges. Tighten per-module (and flip the
# CI step to gating) as 07-02-legacy-monolith-decomposition splits the
# monolith into type-check-clean modules.
python_version = "3.14"
files = ["src/anomaly_metric_creator"]
# numpy/protobuf stubs are not installed; silence the missing-import noise
# so real type errors in first-party code stay readable.
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# F401 (unused imports) is configured repo-wide so that `ruff check`
# on any path picks up the same rule. Automated enforcement is scoped
# to tests/ via the .pre-commit-config.yaml hook (where the test-
# hygiene churn lives); non-test files are not linted by default.
# See CLAUDE.md "Pre-PR checklist > Test hygiene".
select = ["F401"]
