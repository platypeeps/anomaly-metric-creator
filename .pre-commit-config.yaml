# See README.md "Test-hygiene lint" and CLAUDE.md "Pre-PR checklist >
# Test hygiene" for the rules these hooks enforce. Install with
# `pre-commit install` after `pip install -e ".[dev]"`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # `rev` must match the `ruff==X.Y.Z` pin in
    # `[project.optional-dependencies].dev` in `pyproject.toml` so a
    # local `ruff check` and this hook resolve the same binary. Bump
    # both lines together.
    rev: v0.15.17
    hooks:
      - id: ruff
        name: ruff F401 (tests/)
        files: ^tests/.*\.py$
  - repo: local
    hooks:
      # Forbid duplicate `spec_from_file_location(...)` loads of
      # `anomaly-metric-creator.py` in tests/. The canonical loader
      # lives in `tests/conftest.py:_load_amc()` (memoized) and is
      # consumed via the session-scoped `amc` fixture. PR #63 and
      # PR #64 each shipped a fresh `spec_from_file_location` call in
      # a new test file; the lint catches that pattern structurally
      # instead of relying on Copilot to notice on every new test.
      # Exempt a line with a trailing `# amc-load: allow` when a fresh
      # module instance is genuinely required (monkey-patch isolation,
      # collection-time parametrize loaders).
      - id: amc-no-direct-spec-load
        name: forbid duplicate amc loads outside conftest.py
        # Explicit `python` interpreter so the hook does not rely on the
        # script's shebang or the executable bit (the latter is dropped
        # by Windows checkouts and by some `git archive` consumers). The
        # `python` symbol resolves to the hook's own pre-commit venv
        # under `language: python`. Copilot PR #74 round-1.
        entry: python tools/check_amc_module_load.py
        language: python
        files: ^tests/.*\.py$
        pass_filenames: true
      # Forbid internal role-name leaks (canonical list lives in
      # `tools/check_role_name_leaks.py::_FORBIDDEN_LABELS`) in any
      # text-bearing file in the repo. Two `APPROVED` comments on
      # PR #86 leaked an internal role name in the handoff sentence;
      # VER-701 edited those comments and added this lint so future
      # leaks fail structurally at commit time instead of surfacing in
      # a PR thread. The script also accepts a `-` stdin mode so it
      # can pre-flight comment-body files before they are piped
      # through `gh pr comment --body-file …` (see the script's
      # module docstring for the full invocation pattern and the
      # `# role-name-lint: allow` per-line escape hatch).
      - id: role-name-leaks
        name: forbid internal role-name leaks
        entry: python tools/check_role_name_leaks.py
        language: python
        # `types: [text]` lets pre-commit's own identify pass filter
        # binary files (images / fonts / archives) before we ever see
        # them. The script's own `UnicodeDecodeError` skip is a
        # belt-and-braces fallback for files pre-commit mis-classifies
        # and for ad-hoc CLI runs that pass arbitrary paths.
        types: [text]
        pass_filenames: true
      # Reject branch names that embed the ticket literal
      # `ver-<N>` / `VER-<N>`. PRs #47–#77 and #86 all shipped a
      # head ref shaped like `sdelmas/ver-<N>-…`, republishing the
      # internal ticket id in the public PR URL even after PR
      # titles had been cleaned up. The hook runs at the `pre-push`
      # stage so it fires once per push (a check on every commit
      # would be noisy for routine work on a clean branch), and
      # uses `pass_filenames: false` + `always_run: true` so it
      # does not depend on the diff. Install with
      # `pre-commit install --hook-type pre-push` after the
      # standard `pre-commit install` invocation; the default
      # install only registers the pre-commit-stage hooks.
      - id: branch-name
        name: forbid ver-NNN literals in branch names
        entry: python tools/check_branch_name.py --current
        language: python
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      # Forbid bare `pip install` in GitHub Actions workflows. After
      # `actions/setup-python`, a bare `pip` can resolve to a different
      # interpreter than the one just selected, so the install lands in the
      # wrong environment — use `python -m pip install` (`uv pip install` is
      # also fine). PR #118 shipped a bare `pip install` in socket.yml; this
      # catches the pattern structurally. Exempt a line with a trailing
      # `# pip-lint: allow`. See CLAUDE.md "Workflow pip lint".
      - id: workflow-pip
        name: forbid bare 'pip install' in workflows
        entry: python tools/check_workflow_pip.py
        language: python
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
