# See README.md "Test-hygiene lint" and the "Test hygiene" heading under
# "Review Checklist" in .trellis/spec/amc/backend/testing-quality.md for the
# rules these hooks enforce. Install with
# `pre-commit install` after `pip install -e ".[dev]"`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # `rev` must match the `ruff==X.Y.Z` pin in
    # `[project.optional-dependencies].dev` in `pyproject.toml` so a
    # local `ruff check` and this hook resolve the same binary. Bump
    # both lines together.
    rev: v0.16.1
    hooks:
      - id: ruff
        name: ruff F401 (tests/)
        files: ^tests/.*\.py$
      # Catch unused local variables in runtime code, helper tools, and Python
      # hook adapters. PR #137/#140 code-quality comments flagged this shape in
      # non-test files, while the existing F401 hook intentionally remains
      # scoped to tests/.
      - id: ruff
        name: ruff F841 (runtime/tools/hooks)
        args: [--select, F841]
        files: ^(src|tools|\.codex/hooks|\.github/copilot/hooks|\.gemini/hooks)/.*\.py$
  - repo: local
    hooks:
      # Parse Python files without writing bytecode. `python -m py_compile`
      # would also catch syntax errors, but it writes `__pycache__` entries
      # beside generated hook files; this AST-only guard catches malformed
      # Python before review without filesystem side effects.
      - id: python-syntax
        name: validate Python syntax without bytecode
        entry: python tools/check_python_syntax.py
        language: python
        files: ^(scripts|src|tests|tools|\.codex/hooks|\.github/copilot/hooks|\.gemini/hooks)/.*\.py$
        pass_filenames: true
      # Forbid duplicate `spec_from_file_location(...)` loads of
      # `anomaly-metric-creator.py` in tests/. The canonical loader
      # lives in `tests/conftest.py:_load_amc()` (memoized) and is
      # consumed via the session-scoped `amc` fixture. PR #63 and
      # PR #64 each shipped a fresh `spec_from_file_location` call in
      # a new test file; the lint catches that pattern structurally
      # instead of relying on Copilot to notice on every new test.
      # Exempt a line with a trailing `# amc-load: allow` when a fresh
      # module instance is genuinely required (monkey-patch isolation,
      # collection-time parametrize loaders).
      - id: amc-no-direct-spec-load
        name: forbid duplicate amc loads outside conftest.py
        # Explicit `python` interpreter so the hook does not rely on the
        # script's shebang or the executable bit (the latter is dropped
        # by Windows checkouts and by some `git archive` consumers). The
        # `python` symbol resolves to the hook's own pre-commit venv
        # under `language: python`. Copilot PR #74 round-1.
        entry: python tools/check_amc_module_load.py
        language: python
        files: ^tests/.*\.py$
        pass_filenames: true
      # Keep GB-scale generated artifacts out of whole-file test reads. The
      # AST guard ignores prose and permits reviewed, deliberately small files
      # through a trailing `# resource-lint: allow` marker.
      - id: test-resource-cost
        name: guard test resource cost
        entry: python tools/check_test_resource_cost.py
        language: python
        files: ^tests/.*\.py$
        pass_filenames: true
      # Forbid internal role-name leaks (canonical list lives in
      # `tools/check_role_name_leaks.py::_FORBIDDEN_LABELS`) in any
      # text-bearing file in the repo. Two `APPROVED` comments on
      # PR #86 leaked an internal role name in the handoff sentence;
      # VER-701 edited those comments and added this lint so future
      # leaks fail structurally at commit time instead of surfacing in
      # a PR thread. The script also accepts a `-` stdin mode so it
      # can pre-flight comment-body files before they are piped
      # through `gh pr comment --body-file …` (see the script's
      # module docstring for the full invocation pattern and the
      # `# role-name-lint: allow` per-line escape hatch).
      - id: role-name-leaks
        name: forbid internal role-name leaks
        entry: python tools/check_role_name_leaks.py
        language: python
        # `types: [text]` lets pre-commit's own identify pass filter
        # binary files (images / fonts / archives) before we ever see
        # them. The script's own `UnicodeDecodeError` skip is a
        # belt-and-braces fallback for files pre-commit mis-classifies
        # and for ad-hoc CLI runs that pass arbitrary paths.
        types: [text]
        pass_filenames: true
      # Commit messages are published on PR pages and need the same role-name
      # protection as tracked text. The commit-msg stage passes the temporary
      # message filename directly to the existing scanner.
      - id: role-name-commit-message
        name: forbid internal role-name leaks in commit messages
        entry: python tools/check_role_name_leaks.py
        language: python
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
      # Reject branch names that embed the ticket literal
      # `ver-<N>` / `VER-<N>`. PRs #47–#77 and #86 all shipped a
      # head ref shaped like `sdelmas/ver-<N>-…`, republishing the
      # internal ticket id in the public PR URL even after PR
      # titles had been cleaned up. The hook runs at the `pre-push`
      # stage so it fires once per push (a check on every commit
      # would be noisy for routine work on a clean branch), and
      # uses `pass_filenames: false` + `always_run: true` so it
      # does not depend on the diff. Install with
      # `pre-commit install --hook-type pre-push` after the
      # standard `pre-commit install` invocation; the default
      # install only registers the pre-commit-stage hooks.
      - id: branch-name
        name: forbid ver-NNN literals in branch names
        entry: python tools/check_branch_name.py --current
        language: python
        stages: [pre-push]
        always_run: true
        pass_filenames: false
      # Forbid bare or unpinned `pip install` in GitHub Actions workflows. After
      # `actions/setup-python`, a bare `pip` can resolve to a different
      # interpreter than the one just selected, so the install lands in the
      # wrong environment; direct third-party installs must also use exact
      # `==` pins so workflow tooling is reproducible. Use
      # `python -m pip install PACKAGE==VERSION` (`uv pip install
      # PACKAGE==VERSION` is also fine). PR #118 shipped a bare `pip install`
      # in the former standalone Socket workflow; this catches the pattern
      # structurally. Exempt a line
      # with a trailing `# pip-lint: allow`. See the
      # tools/check_workflow_pip.py module docstring.
      - id: workflow-pip
        name: forbid bare or unpinned 'pip install' in workflows
        entry: python tools/check_workflow_pip.py
        language: python
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
      # The CI classifier and Trellis review scripts decide whether remote
      # Actions can take the lightweight path. Keep shell syntax failures local
      # so a docs/tooling-only PR does not spend a runner just to discover a
      # malformed script. Matched by shape so an installed command-pack refresh
      # never has to edit this hook.
      - id: shell-syntax
        name: validate shell script syntax
        # `set -e` is load-bearing: without it the loop exits with the status
        # of the last `bash -n`, so a broken early script is masked by a later
        # good one (verified: exit 0 with a syntax error present).
        entry: bash -c 'set -e; for script in "$@"; do bash -n "$script"; done' --
        language: system
        files: ^scripts/.*\.sh$
        pass_filenames: true
      # Guard the named anchors that keep local full-check, CI lane selection,
      # CodeQL/Socket cadence, and review docs in sync. This is intentionally
      # text-based and stdlib-only so it can run in pre-commit without
      # installing project dependencies.
      - id: ci-review-contract
        name: guard CI/review cadence contract
        entry: python tools/check_ci_review_contract.py
        language: python
        files: ^(\.github/workflows/.*\.ya?ml|scripts/(classify-ci-changes|classify_ci_changes|sd-ai-command-pack-(full-check|housekeeping|review-scope|review-local))\.sh|scripts/(check-review-preflight\.mjs|sd-ai-command-pack-install-audit\.py|sd-ai-command-pack-pr-body-scope\.py)|tools/check_ci_review_contract\.py|tests/test_pr_body_scope_lint\.py|docs/(DEVELOPMENT_CYCLE|SD_AI_COMMAND_PACK)\.md|\.sd-ai-command-pack/pr-body-scope\.json|\.trellis/spec/amc/backend/testing-quality\.md)$
        pass_filenames: false
      # Keep Copilot's mechanical review instructions in sync with the Trellis
      # specs, PR template checklist, copied adapter policy, and local
      # full-check wiring. Reviewer judgment stays in prose; drift-prone
      # anchors get enforced here and in the review-churn test suite.
      - id: copilot-instruction-contract
        name: guard Copilot instruction contract
        entry: python tools/check_copilot_instruction_contract.py
        language: python
        files: ^(\.github/(instructions/anomaly-metric-creator\.instructions\.md|PULL_REQUEST_TEMPLATE\.md|agents/trellis-.*\.agent\.md|skills/trellis-.+|copilot/hooks.*|hooks/trellis\.json|prompts/.*)|\.agents/skills/sd-.+|\.gemini/commands/sd/.+|\.opencode/commands/sd-.+|docs/SD_AI_COMMAND_PACK\.md|scripts/(sd-ai-command-pack-(full-check|housekeeping|review-scope|review-local))\.sh|scripts/(check-review-preflight\.mjs|sd-ai-command-pack-(install-audit|pr-body-scope|review-learnings|update-spec-kb)\.py)|tools/check_copilot_instruction_contract\.py|tests/test_pr_body_scope_lint\.py|\.sd-ai-command-pack/pr-body-scope\.json|\.trellis/spec/amc/backend/(testing-quality|documentation-review)\.md)$
        pass_filenames: false
      # Keep every prose description of the PR-body scope guard naming the same
      # category headings the guard recognizes. The heading set is derived from
      # the guard itself, so a category added in the config or the script's
      # defaults fails until all five mirrors say so.
      - id: scope-heading-mirrors
        name: guard PR-body scope heading mirrors
        entry: python tools/check_scope_heading_mirrors.py
        language: python
        files: ^(\.github/(PULL_REQUEST_TEMPLATE\.md|copilot-instructions\.md|instructions/anomaly-metric-creator\.instructions\.md)|docs/DEVELOPMENT_CYCLE\.md|\.trellis/spec/amc/backend/documentation-review\.md|scripts/sd-ai-command-pack-pr-body-scope\.py|tools/check_scope_heading_mirrors\.py|\.sd-ai-command-pack/pr-body-scope\.json)$
        pass_filenames: false
      # Forbid `except BaseException` / bare `except` in generated Python hook
      # adapters and require a short reason on intentionally empty
      # `except Exception: pass` handlers. This keeps the PR #140 hook-adapter
      # review lesson mechanical without enabling a broad repo-wide
      # blind-except lint.
      - id: agent-hook-exceptions
        name: guard agent hook exception handlers
        entry: python tools/check_agent_hook_exceptions.py
        language: python
        files: ^(\.codex/hooks|\.github/copilot/hooks|\.gemini/hooks)/.*\.py$
        pass_filenames: true
      # Forbid unfinished Trellis journal/task template placeholders in
      # committed workspace artifacts, and keep workspace journal commit lists
      # aligned with their index rows. Session journals and task notes are repo
      # history, not scratchpads, so fill template sections before committing.
      - id: trellis-placeholders
        name: guard Trellis artifact hygiene
        entry: python tools/check_trellis_placeholders.py
        language: python
        files: ^\.trellis/(workspace|tasks)/.*\.(md|json|jsonl|ya?ml|toml)$
        pass_filenames: true
      # Keep quoted acceptance-criteria commands runnable as written. A
      # multi-file `grep -c` prints one `file:count` line per file and can never
      # return the single `0` a criterion claims, and `\s`/`\d`/`\w` are
      # GNU/PCRE-only escapes that stock BSD grep matches as literal letters.
      - id: task-criteria-commands
        name: guard Trellis acceptance-criteria commands
        entry: python tools/check_task_criteria_commands.py
        language: python
        files: ^\.trellis/tasks/.*\.md$
        pass_filenames: true
      # Meta-guard over the lints above: CI picks a lane from the changed
      # paths, and never runs pre-commit, so a lint whose watched files select
      # a lane that runs neither its CI step nor its test job is enforced in
      # appearance only. Reads the whole repository, so no filenames.
      - id: guard-ci-coverage
        name: guard CI lane coverage for repository lints
        entry: python tools/check_guard_ci_coverage.py
        language: python
        additional_dependencies: [PyYAML]
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/ci\.yml|scripts/classify-ci-changes\.sh|tools/check_[a-z_0-9]+\.py|tests/test_[a-z_0-9]+\.py)$
        pass_filenames: false
      # Keep command-trace JSON import/export boundaries strict. PR #140's
      # trace review comments came from direct casts and silent filtering on
      # untrusted trace payloads; these modules should use the shared helper
      # validators instead.
      - id: trace-payload-antipatterns
        name: forbid trace payload validation anti-patterns
        entry: python tools/check_trace_payload_antipatterns.py
        language: python
        files: ^src/anomaly_metric_creator/(server_traces|trace_bundle)\.py$
        pass_filenames: true
      # Ratchet the 800-line behavior-module cap. The rule was prose only, and
      # the prose drifted: it named one deliberate exception while seven
      # modules were over. The tool owns the enrolled list; enrolled modules
      # may only shrink. Whole-package rule, so filenames are ignored.
      - id: module-size
        name: ratchet the behavior-module line cap
        entry: python tools/check_module_size.py
        language: python
        files: ^src/anomaly_metric_creator/.*\.py$
        pass_filenames: false
